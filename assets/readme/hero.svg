<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenClaw Usage Report</title>
  <desc id="hero-desc">Usage and performance reporting for OpenClaw agents: parse session JSONL for task duration, tool latency, model tokens and skill usage. Zero dependencies, local only, token-first. Shows a terminal panel running usage-report.py with a per-tool latency table.</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>

  <!-- left: title block -->
  <g id="title-block" transform="translate(56 40)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#8b949e">OPENCLAW · AGENT SKILL</text>

    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Usage Report</text>

    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#c9d1d9">用量报告 · 性能查询 · token 主指标</text>
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#8b949e">session JSONL · 任务/工具/模型耗时 · 零依赖</text>

    <text x="0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#8b949e">MIT LICENSE · SKILL FOR OPENCLAW · v1.0.0</text>
  </g>

  <!-- right: usage report terminal panel -->
  <g id="terminal-panel" transform="translate(700 44)">
    <rect width="450" height="276" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- terminal dots -->
    <circle cx="18" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="20" r="5" fill="#27c93f"/>

    <text x="78" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">usage-report · local</text>

    <!-- command line -->
    <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3fb950">$ python usage-report.py --today</text>

    <!-- summary -->
    <text x="24" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">tasks: 7 | tokens: 1.7M | 230.0m</text>

    <!-- tool latency table (fixed column alignment) -->
    <text x="24" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">tool</text>
    <text x="150" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">calls</text>
    <text x="230" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">total</text>
    <text x="310" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">avg</text>

    <text x="24" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#58a6ff">exec</text>
    <text x="150" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">204</text>
    <text x="230" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">54.5m</text>
    <text x="310" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">16.0s</text>

    <text x="24" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">web_fetch</text>
    <text x="150" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">37</text>
    <text x="230" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">12.5m</text>
    <text x="310" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">20.2s</text>

    <text x="24" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">process</text>
    <text x="150" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">23</text>
    <text x="230" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">9.8m</text>
    <text x="310" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">25.6s</text>

    <!-- model line -->
    <text x="24" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">model  tiantong | 146 calls</text>
    <text x="24" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">in 1.51M · out 150.9K · 28.3m</text>
  </g>
</svg>
